plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url 'https://maven.azuredoom.com/mods'}    
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
        exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Neoforge
    implementation "net.neoforged:neoforge:${neo_version}"
    // Geckolib
    implementation "maven.modrinth:8BmcQJ2H:Grwn5rUB"
    // JEI
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:19.19.4.230")
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:19.19.4.230")
	runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:19.19.4.230")
    // Custom Portal API
	implementation("net.kyrptonaught.customportalapi:cpapireforged-neo-1.21.1:1.2.1")
	jarJar("net.kyrptonaught.customportalapi:cpapireforged-neo-1.21.1:1.2.1")
    // BCLib New Dawn
    implementation "curse.maven:bclib-neoforge-1422283:8608827"
    implementation "curse.maven:worldweaver-neoforge-1422284:8594162"
    implementation "curse.maven:wunderlib-neoforge-1422273:7469725"
    // Nuit (FabricSkyBoxes)
    compileOnly("maven.modrinth:YBz7DOs8:blbu29BJ")
    runtimeOnly("maven.modrinth:YBz7DOs8:blbu29BJ")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
